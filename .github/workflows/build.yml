name: Verify planner
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: planner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/PlannerApp.Tests/PlannerApp.Tests.csproj -c Release --logger trx
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-android
      - run: dotnet build PlannerApp/PlannerApp.csproj -f net10.0-android -p:TargetFrameworks=net10.0-android -p:AndroidSdkDirectory=$ANDROID_HOME -p:AcceptAndroidSDKLicenses=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: planner-android-debug
          path: PlannerApp/bin/Debug/net10.0-android/*Signed.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-windows
      - run: dotnet build PlannerApp/PlannerApp.csproj -f net10.0-windows10.0.19041.0 -p:TargetFrameworks=net10.0-windows10.0.19041.0
